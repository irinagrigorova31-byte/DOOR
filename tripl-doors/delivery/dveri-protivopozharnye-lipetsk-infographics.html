<!-- ============ Рис. 1 — Устройство противопожарной двери ДПМ (в H2 «Чем противопожарная дверь отличается от обычной») ============ -->
<figure>
<svg viewBox="0 0 720 380" role="img" aria-labelledby="p1-t p1-d" style="max-width:100%;height:auto;font-family:var(--sans)">
  <title id="p1-t">Устройство противопожарной двери ДПМ</title>
  <desc id="p1-d">Противопожарная дверь ДПМ состоит из стального полотна с негорючим минеральным наполнителем, терморасширяющегося уплотнителя по периметру, термостойкой фурнитуры, доводчика для автоматического закрывания и маркировочной шильды с классом огнестойкости.</desc>
  <!-- коробка -->
  <rect x="250" y="40" width="230" height="300" fill="#f4f4f4" stroke="#102d50" stroke-width="6"/>
  <!-- полотно -->
  <rect x="262" y="52" width="206" height="276" fill="#2C5F8A" stroke="#102d50" stroke-width="2"/>
  <!-- разрез: негорючий наполнитель (окно в полотне) -->
  <rect x="300" y="150" width="120" height="90" fill="#0E8C8C" opacity="0.85"/>
  <text x="360" y="190" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle"><tspan x="360" dy="0">Негорючий</tspan><tspan x="360" dy="15">минеральный</tspan><tspan x="360" dy="15">наполнитель</tspan></text>
  <!-- терморасширяющийся уплотнитель по периметру -->
  <rect x="262" y="52" width="206" height="276" fill="none" stroke="#D69614" stroke-width="4" stroke-dasharray="6 5"/>
  <!-- доводчик сверху -->
  <rect x="360" y="52" width="70" height="14" fill="#22252a"/>
  <!-- ручка/замок -->
  <rect x="278" y="185" width="14" height="30" fill="#22252a"/>
  <!-- шильда -->
  <rect x="292" y="270" width="146" height="40" fill="#ffffff" stroke="#C83E3E" stroke-width="2"/>
  <text x="365" y="286" fill="#C83E3E" font-size="12" font-weight="700" text-anchor="middle">Шильда: EI 60</text>
  <text x="365" y="302" fill="#22252a" font-size="10" text-anchor="middle">класс + данные завода</text>
  <!-- выноски -->
  <text x="120" y="60" fill="#22252a" font-size="13" font-weight="700" text-anchor="middle"><tspan x="120" dy="0">Доводчик</tspan><tspan x="120" dy="15" font-weight="400">автозакрывание</tspan></text>
  <path d="M155 60 L360 59" stroke="#828b91" stroke-width="1.5"/>
  <text x="120" y="150" fill="#D69614" font-size="13" font-weight="700" text-anchor="middle"><tspan x="120" dy="0">Терморасширяющийся</tspan><tspan x="120" dy="15">уплотнитель</tspan></text>
  <path d="M150 150 L262 150" stroke="#828b91" stroke-width="1.5"/>
  <text x="120" y="205" fill="#22252a" font-size="13" font-weight="700" text-anchor="middle"><tspan x="120" dy="0">Термостойкая</tspan><tspan x="120" dy="15" font-weight="400">фурнитура</tspan></text>
  <path d="M150 200 L278 200" stroke="#828b91" stroke-width="1.5"/>
  <text x="600" y="200" fill="#0E8C8C" font-size="13" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">Разрез</tspan><tspan x="600" dy="15" fill="#22252a">полотна</tspan></text>
  <path d="M540 195 L420 195" stroke="#828b91" stroke-width="1.5"/>
</svg>
<figcaption>Рис. 1. Устройство противопожарной двери ДПМ</figcaption>
</figure>

<!-- ============ Рис. 2 — Что означает маркировка EI (в H2 «Что означает предел огнестойкости EI 60») ============ -->
<figure>
<svg viewBox="0 0 720 340" role="img" aria-labelledby="p2-t p2-d" style="max-width:100%;height:auto;font-family:var(--sans)">
  <title id="p2-t">Что означает маркировка EI у противопожарной двери</title>
  <desc id="p2-d">В маркировке EI буква E обозначает целостность полотна, буква I теплоизоляцию, а число это время в минутах. Наши двери имеют предел EI 60. Классы EI 30, EI 90 и EI 120 показаны для справки.</desc>
  <!-- расшифровка E / I -->
  <rect x="40" y="40" width="300" height="70" fill="#102d50"/>
  <text x="70" y="85" fill="#0088cd" font-size="40" font-weight="700" text-anchor="middle">E</text>
  <text x="205" y="72" fill="#ffffff" font-size="15" text-anchor="middle"><tspan x="205" dy="0">целостность</tspan><tspan x="205" dy="18" fill="#9fb0c4">полотно не разрушается</tspan></text>
  <rect x="40" y="120" width="300" height="70" fill="#102d50"/>
  <text x="70" y="165" fill="#0088cd" font-size="40" font-weight="700" text-anchor="middle">I</text>
  <text x="205" y="152" fill="#ffffff" font-size="15" text-anchor="middle"><tspan x="205" dy="0">теплоизоляция</tspan><tspan x="205" dy="18" fill="#9fb0c4">не пропускает жар</tspan></text>
  <text x="190" y="228" fill="#22252a" font-size="15" text-anchor="middle">Число это время в минутах, которое дверь держит огонь</text>
  <!-- шкала классов -->
  <text x="530" y="55" fill="#22252a" font-size="14" font-weight="700" text-anchor="middle">Классы предела</text>
  <rect x="410" y="75" width="240" height="46" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
  <text x="530" y="103" fill="#828b91" font-size="16" text-anchor="middle">EI 30 (справочно)</text>
  <rect x="410" y="127" width="240" height="56" fill="#2E9E5B"/>
  <text x="530" y="153" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">EI 60</text>
  <text x="530" y="173" fill="#ffffff" font-size="12" text-anchor="middle">наш подтверждённый класс</text>
  <rect x="410" y="189" width="240" height="46" fill="#f4f4f4" stroke="#e7e7e7" stroke-width="1"/>
  <text x="530" y="217" fill="#828b91" font-size="16" text-anchor="middle">EI 90 / EI 120 (справочно)</text>
  <text x="360" y="300" fill="#22252a" font-size="14" font-style="italic" text-anchor="middle">Наши двери ДПМ: предел EI 60, класс дымогазонепроницаемости S15</text>
</svg>
<figcaption>Рис. 2. Что означает маркировка EI у противопожарной двери</figcaption>
</figure>
