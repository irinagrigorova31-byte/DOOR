<!-- ВЕРХНИЙ БЛОК (hero) витрины «Гаражные ворота» — вставить в HTML-виджет Elementor ДО каталога WooCommerce.
     Тема Porto + Popup Maker. Шапку/меню/хлебные крошки НЕ включать. Каталог НЕ верстать.
     Шрифт Poppins (грузит Porto). CTA → href="#svyaz" (триггер попапа pum-9515). Фото → [cat_hero_image]. -->
<style>
.szp-hero{font-family:"Poppins",sans-serif;font-weight:400;background:#102d50;color:#fff;
  margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw)}
.szp-hero *{box-sizing:border-box}
.szp-hero .wrap{max-width:1160px;margin:0 auto;padding:56px 16px;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.szp-hero h1{font-size:34px;line-height:40px;font-weight:700;margin:0 0 16px;color:#fff}
.szp-hero h1 b{color:#0088cd;font-weight:700}
.szp-hero .lead{color:#cdd7e3;margin:0 0 32px}
.szp-hero .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
.szp-hero .num{font-size:34px;line-height:1;font-weight:700;color:#0088cd}
.szp-hero .num--sm{font-size:22px;line-height:1.1}
.szp-hero .cap{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#9fb0c4;margin-top:6px}
.szp-hero .cta{display:inline-block;background:#22252a;color:#fff;text-decoration:none;font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;padding:14px 26px;border:0;
  transition:color .15s, background-color .15s, border-color .15s, box-shadow .15s, transform .2s}
.szp-hero .cta:hover{background:#0077b3;color:#fff;text-decoration:none}
.szp-hero .photo{aspect-ratio:4 / 3;overflow:hidden;background:linear-gradient(135deg,#1b3a63,#0f2743);border:1px solid #24466e;
  display:flex;align-items:center;justify-content:center;color:#7f97b5;font-size:14px;text-align:center;padding:24px}
.szp-hero .photo img{width:100%;height:100%;object-fit:cover;object-position:center}
@media (max-width:820px){.szp-hero .wrap{grid-template-columns:1fr;gap:32px}.szp-hero .stats{grid-template-columns:repeat(2,1fr)}.szp-hero h1{font-size:28px;line-height:34px}}
</style>

<div class="szp-hero"><div class="wrap">
  <div>
    <h1>Металлические гаражные ворота в Липецке — <b>распашные, на заказ</b></h1>
    <p class="lead">С калиткой и утеплением — варим по размерам проёма, замеряем и ставим сами.</p>
    <div class="stats">
      <div><div class="num">с 2005</div><div class="cap">Производство</div></div>
      <div><div class="num">≈25 000</div><div class="cap">Изготовлено изделий</div></div>
      <div><div class="num num--sm">ГОСТ 31174-2017</div><div class="cap">Соответствие</div></div>
      <div><div class="num">1000 м²</div><div class="cap">Собственный цех</div></div>
    </div>
    <a class="cta" href="#svyaz">Вызвать замерщика</a>
  </div>
  <div class="photo">[cat_hero_image]</div>
</div></div>
