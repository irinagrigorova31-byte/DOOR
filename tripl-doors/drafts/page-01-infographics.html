<!-- ============ Рис. 1 — Дерево решений «Нужен ли терморазрыв» (в H2 «Нужен ли терморазрыв») ============ -->
<figure>
<svg viewBox="0 0 720 400" role="img" aria-labelledby="ig1-t ig1-d"
     xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;font-family:'PT Sans','Segoe UI',system-ui,Arial,sans-serif">
  <title id="ig1-t">Когда входной двери нужен терморазрыв</title>
  <desc id="ig1-d">Терморазрыв нужен на границе с улицей или холодным тамбуром; между квартирой и тёплым подъездом он не нужен.</desc>
  <rect x="260" y="16" width="200" height="56" fill="#102d50"/>
  <text x="360" y="49" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">Где стоит дверь?</text>
  <path d="M320 72 L180 132" stroke="#0088cd" stroke-width="3" fill="none"/>
  <path d="M400 72 L540 132" stroke="#0088cd" stroke-width="3" fill="none"/>
  <text x="180" y="150" fill="#22252a" font-size="15" text-anchor="middle"><tspan x="180" dy="0">Граница с улицей</tspan><tspan x="180" dy="20">или холодным тамбуром</tspan><tspan x="180" dy="20" fill="#828b91">частный дом, дача, отдельный вход</tspan></text>
  <text x="540" y="150" fill="#22252a" font-size="15" text-anchor="middle"><tspan x="540" dy="0">Между квартирой</tspan><tspan x="540" dy="20">и тёплым подъездом</tspan></text>
  <rect x="55" y="238" width="250" height="72" fill="#2E9E5B"/>
  <text x="180" y="282" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">Терморазрыв нужен</text>
  <rect x="415" y="238" width="250" height="72" fill="#C83E3E"/>
  <text x="540" y="272" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle"><tspan x="540" dy="0">Терморазрыв — переплата,</tspan><tspan x="540" dy="22">не работает</tspan></text>
  <path d="M180 150 L180 238" stroke="#e7e7e7" stroke-width="2"/>
  <path d="M540 168 L540 238" stroke="#e7e7e7" stroke-width="2"/>
  <text x="360" y="352" fill="#22252a" font-size="15" font-style="italic" text-anchor="middle">Не уверены — подскажем на замере</text>
</svg>
<figcaption><em>Рис. 1. Когда входной двери нужен терморазрыв</em></figcaption>
</figure>

<!-- ============ Рис. 2 — Разрез полотна (в H2 «Какая дверь надёжная…»). Значения [ТРЕБУЕТСЯ]. ============ -->
<figure>
<svg viewBox="0 0 720 380" role="img" aria-labelledby="ig2-t ig2-d"
     xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;font-family:'PT Sans','Segoe UI',system-ui,Arial,sans-serif">
  <title id="ig2-t">Из чего состоит полотно входной двери</title>
  <desc id="ig2-d">Разрез полотна: наружный стальной лист, рёбра жёсткости, наполнитель (не гофрокартон), внутренняя отделка, контур уплотнения.</desc>
  <!-- слои полотна (вид сбоку в разрезе) -->
  <rect x="120" y="40" width="40" height="280" fill="#102d50"/>            <!-- наружный лист -->
  <rect x="160" y="40" width="150" height="280" fill="#f4f4f4" stroke="#e7e7e7"/> <!-- наполнитель -->
  <rect x="200" y="40" width="8" height="280" fill="#0088cd"/>              <!-- ребро жёсткости -->
  <rect x="262" y="40" width="8" height="280" fill="#0088cd"/>             <!-- ребро жёсткости -->
  <rect x="310" y="40" width="26" height="280" fill="#22252a"/>            <!-- внутренняя отделка -->
  <rect x="336" y="40" width="10" height="280" fill="#2E9E5B"/>            <!-- контур уплотнения -->
  <!-- выноски -->
  <line x1="140" y1="40" x2="140" y2="24" stroke="#828b91"/><line x1="140" y1="24" x2="470" y2="24" stroke="#828b91"/>
  <text x="480" y="29" fill="#22252a" font-size="15">Наружный стальной лист — [ТРЕБУЕТСЯ: N мм]</text>
  <line x1="204" y1="120" x2="204" y2="104" stroke="#828b91"/><line x1="204" y1="104" x2="470" y2="104" stroke="#828b91"/>
  <text x="480" y="109" fill="#22252a" font-size="15">Рёбра жёсткости</text>
  <line x1="235" y1="180" x2="470" y2="180" stroke="#828b91"/>
  <text x="480" y="176" fill="#22252a" font-size="15"><tspan x="480" dy="0">Наполнитель — [ТРЕБУЕТСЯ:</tspan><tspan x="480" dy="19">минвата / базальт], не гофрокартон</tspan></text>
  <line x1="323" y1="250" x2="470" y2="250" stroke="#828b91"/>
  <text x="480" y="255" fill="#22252a" font-size="15">Внутренняя отделка (МДФ / порошок)</text>
  <line x1="341" y1="300" x2="470" y2="300" stroke="#828b91"/>
  <text x="480" y="305" fill="#22252a" font-size="15">Контур уплотнения — [ТРЕБУЕТСЯ]</text>
  <text x="120" y="352" fill="#828b91" font-size="13">Соответствие ГОСТ 31173-2016</text>
</svg>
<figcaption><em>Рис. 2. Из чего состоит полотно входной двери</em></figcaption>
</figure>

<!-- ============ Рис. 3 — Обычная дверь vs противопожарная ДПМ (в H2 «Противопожарные двери завода») ============ -->
<figure>
<svg viewBox="0 0 720 380" role="img" aria-labelledby="ig3-t ig3-d"
     xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;font-family:'PT Sans','Segoe UI',system-ui,Arial,sans-serif">
  <title id="ig3-t">Обычная и противопожарная дверь — разные изделия</title>
  <desc id="ig3-d">Обычная входная дверь ДМ соответствует ГОСТ 31173-2016 без предела огнестойкости; противопожарная дверь ДПМ имеет предел EI60/S15 по ТР ЕАЭС 043/2017.</desc>
  <!-- Колонка A -->
  <rect x="30" y="20" width="320" height="46" fill="#102d50"/>
  <text x="190" y="49" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Обычная входная дверь (ДМ)</text>
  <rect x="30" y="66" width="320" height="230" fill="#f4f4f4" stroke="#e7e7e7"/>
  <text x="50" y="104" fill="#22252a" font-size="15"><tspan x="50" dy="0">Задача: квартира, частный дом</tspan><tspan x="50" dy="30">Стандарт: ГОСТ 31173-2016</tspan><tspan x="50" dy="30" fill="#828b91">Предела огнестойкости нет</tspan><tspan x="50" dy="30">Это ассортимент витрины</tspan></text>
  <!-- Колонка B -->
  <rect x="370" y="20" width="320" height="46" fill="#102d50"/>
  <text x="530" y="49" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Противопожарная дверь (ДПМ)</text>
  <rect x="370" y="66" width="320" height="230" fill="#f4f4f4" stroke="#e7e7e7"/>
  <text x="390" y="104" fill="#22252a" font-size="15"><tspan x="390" dy="0">Задача: где нужна огнестойкость</tspan><tspan x="390" dy="30" font-weight="700" fill="#0088cd">Предел EI60 / S15</tspan><tspan x="390" dy="30">ТР ЕАЭС 043/2017</tspan><tspan x="390" dy="26" fill="#828b91">№ ЕАЭС RU C-RU.НЕ25.В.00065/25</tspan></text>
  <!-- разделительная плашка -->
  <rect x="30" y="312" width="660" height="46" fill="#22252a"/>
  <text x="360" y="341" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">Обычная квартирная дверь противопожарной не является</text>
</svg>
<figcaption><em>Рис. 3. Обычная и противопожарная дверь — разные изделия</em></figcaption>
</figure>
