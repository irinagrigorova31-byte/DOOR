<!-- @dsCard height=320 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap">
<style>
  .cv-ground { fill: var(--white); }
  .cv-navy { fill: var(--navy); }
  .cv-blue { fill: var(--blue); }
  .cv-ink { fill: var(--ink); }
  .cv-tint { fill: var(--surface-muted); }
  .cv-name { fill: var(--ink); font-family: var(--font-sans); font-weight: 700; letter-spacing: 0.01em; }
  .cv-tag { fill: var(--text-muted); font-family: var(--font-sans); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
</style>
<svg width="960" height="320" viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Сталь-Плюс design system cover">
  <!--
    blocks: navy full-height slab (the brand's header colour, biggest); blue 140² (the one accent); ink 140² (CTA + footer); surface-muted 84² relief.
    arrangement: one tall navy slab bleeding off the right edge, two square satellites staggered left of it, square corners throughout — the brand composes in flush square bands and a modular product grid, not a swatch row.
    pattern: modular square tiles at a space-5 pitch, two merged two-wide, in blue and surface-muted cut into the navy — echoes the product grid and the metallic "M" monogram; a plain grid system wouldn't stagger slabs off the edge, so the staggered arrangement is what makes it this brand.
    scales: sizes 140/84/28, pitch 40, gaps space-5; radius-square (0) everywhere.
  -->
  <rect class="cv-ground" x="0" y="0" width="960" height="320"/>

  <!-- right composition, all x >= 480 -->
  <rect class="cv-navy" x="772" y="-24" width="212" height="368"/>
  <rect class="cv-blue" x="512" y="64" width="140" height="140"/>
  <rect class="cv-ink" x="512" y="224" width="140" height="140"/>
  <rect class="cv-tint" x="792" y="48" width="84" height="84"/>

  <!-- pattern: modular tiles on the navy slab -->
  <rect class="cv-blue" x="792" y="176" width="68" height="28"/>
  <rect class="cv-tint" x="872" y="176" width="28" height="28"/>
  <rect class="cv-tint" x="792" y="216" width="28" height="28"/>
  <rect class="cv-blue" x="832" y="216" width="28" height="28"/>
  <rect class="cv-tint" x="872" y="216" width="28" height="28"/>
  <rect class="cv-blue" x="792" y="256" width="28" height="28"/>
  <rect class="cv-tint" x="832" y="256" width="68" height="28"/>

  <!-- name + tagline, bottom-left on the ground -->
  <text class="cv-name" x="64" y="192" font-size="80">Сталь-</text>
  <text class="cv-name" x="64" y="268" font-size="80">Плюс</text>
  <text class="cv-tag" x="66" y="298" font-size="13">Завод входных дверей в Липецке</text>
</svg>
