<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap">
<style>
  .demo { padding: 32px; background: var(--white); display: flex; flex-direction: column; gap: 20px; align-items: flex-start; }
  .demo .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
</style>
<div id="root"></div>
<script>
  var Button = window.StalPlus.Button;
  var React = window.React;
  var h = React.createElement;
  var phone = h('svg', { width: 18, height: 18, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' },
    h('path', { d: 'M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2Z' }));
  var app = h('div', { className: 'demo' },
    h('div', { className: 'row' },
      h(Button, { variant: 'solid' }, 'Вызвать замерщика'),
      h(Button, { variant: 'outline' }, 'Написать в WhatsApp')
    ),
    h('div', { className: 'row' },
      h(Button, { variant: 'solid', icon: phone }, 'Позвонить'),
      h(Button, { variant: 'solid', disabled: true }, 'Недоступно')
    ),
    h('div', { className: 'row', style: { width: '320px' } },
      h(Button, { variant: 'solid', block: true }, 'В корзину')
    )
  );
  ReactDOM.createRoot(document.getElementById('root')).render(app);
</script>
